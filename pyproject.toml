[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-skill-sec"
version = "1.0.0"
description = "MCP server that audits agent skills/prompts against the 8 malicious-skill supply-chain patterns"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["mcp>=1.0"]

[tool.setuptools]
py-modules = ["mcp_server"]
